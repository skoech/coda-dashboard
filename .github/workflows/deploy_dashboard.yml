name: Build and Deploy CODA Dashboard

on:
    schedule:
        - cron: '0 * * * *' 

    # Also run on manual trigger (useful for testing)
    workflow_dispatch:

jobs:
    build:
      runs-on: ubuntu-latest

      steps:
        # Checkout the repository
        - name: Checkout repository
          uses: actions/checkout@v7
        
        # Install and set up Python
        - name: Set up Python
          uses: actions/setup-python@v7
          with:
            python-version: '3.12'

        # Install dependencies
        - name: Install dependencies
          run: |
            python -m pip install --upgrade pip
            pip install -r requirements.txt

        # Fetch issues
        - name: Fetch issues
          run: python fetch_issues.py
          #env:
            #GITHUB_TOKEN:

        # Build the dashboard
        - name: Build dashboard
          run: python build_frontend.py

        # Upload the built dashboard as an artifact (packages dashboard files for deployment)
        - name: Upload page artifact
          uses: actions/upload-pages-artifact@v5
          with:
            path: . # Upload entire repo

    deploy:
        needs: build
        runs-on: ubuntu-latest

        # Grant permissions for GitHub Pages deployment
        permissions:
            pages: write
            id-token: write
        
        # Configure the deployment environment
        environment:
            name: github-pages
            url: ${{steps.deploy-dashboard.outputs.page_url}}
 
        # Deploy to GitHub Pages
        steps:
          - name: Deploy to GitHub Pages
            id: deploy-dashboard
            uses: actions/deploy-pages@v5
        



        


        
          


        